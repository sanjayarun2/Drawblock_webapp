<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <!-- Template Block Rectangle -->
  <rect id="block-rect" 
        x="90" 
        y="20" 
        width="120" 
        height="80" 
        rx="8" 
        ry="8" 
        fill="#E3F2FF" 
        stroke="#0D6EFD" 
        stroke-width="2"/>
  
  <!-- Template Block Text -->
  <text id="block-text" 
        x="150" 
        y="60" 
        text-anchor="middle" 
        dominant-baseline="middle" 
        font-family="Inter, Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="#212529">Label</text>
  
  <!-- Template Output Arrow (points right) -->
  <path id="output-arrow" 
        d="M 210 60 L 270 60 M 260 50 L 270 60 L 260 70" 
        fill="none" 
        stroke="#0D6EFD" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Optional Input Arrow (can be omitted) -->
  <path id="input-arrow" 
        d="M 30 60 L 90 60 M 80 50 L 90 60 L 80 70" 
        fill="none" 
        stroke="#0D6EFD" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
